<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mela — find desi events near you</title>
<meta name="description" content="Demo: what an attendee sees on Mela — browse desi events, save favourites, buy tickets and get QR passes.">
<link rel="stylesheet" href="../assets/mela.css">
</head>
<body>

<header>
  <div class="hwrap">
    <button class="logo" onclick="go('home')" aria-label="Mela home">Mela<span class="dot"></span></button>
    <div class="searchbar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Search garba, concerts, comedy…" oninput="onSearch(this.value)" aria-label="Search events">
      <span class="city">Toronto, ON</span>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="fwrap">
    <span><b style="font-family:var(--serif); font-size:15px; color:var(--ink)">Mela</b> · Where desi events live</span>
    <span class="demotag">Demo — attendee view · events &amp; payments simulated</span>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>
<script>window.MELA_MODE = "attendee";</script>
<script src="../assets/mela.js"></script>
</body>
</html>
